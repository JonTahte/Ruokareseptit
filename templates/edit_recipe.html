<!DOCTYPE html>
<html>

<head>
  <title>Reseptin muokkaus</title>
</head>

<body>
    <h1>Reseptin muokkaus</h1>
  <form method="post">
    <p>
      Otsikko: <br />
      <input type="text" name="title" value="{{ title }}" maxlength="50" required/>
    </p> 
    <p>
      Valmistusaika: <br />
      <input type="text" name="prep_time" value="{{ prep_time }}" size="8" maxlength=3 pattern="^[1-9][0-9]{0,2}$" required /> min
    </p>
    Reseptin ainekset: <br />
    {% for ingredient in ingredients %}
        <div>
            <input type="text" name="ingredients" value="{{ ingredient }}" maxlength="50" required/>
            <button type="submit" name="remove" value="{{ loop.index0 }}" formnovalidate> - </button>
        </div>
    {% endfor %} 
    <button type="submit" name="add" formnovalidate> Uusi aines </button>
    <p>
    Valmistusohje:<br />
    <textarea name="cooking_steps" rows="8" cols="60" maxlength="1000" required>{{ cooking_steps }}</textarea>
    </p>
    <input type="hidden" name="recipe_id" value="{{ recipe_id }}"/>
    <button type="submit" formaction="/update_recipe" name="send">Päivitä resepti</button>
  </form>
  <p>
      <a href="/recipe/{{ recipe_id }}">Takaisin</a>
  </p>
</body>

</html>
