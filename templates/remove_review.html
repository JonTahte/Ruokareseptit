{% extends "layout.html" %}

{% block title %}Arvostelun poisto{% endblock %}

{% block content %}
<h2>{{ recipe.title }}</h2>
<h3>Arvostelun poisto</h3>
<p>Haluatko varmasti poistaa arvostelun?</p>
<form action="/remove_review/{{ recipe.id }}" method="post">
  <button type="submit" name="remove">Poista</button>
  <button type="submit" name="back">Peruuta</button>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
</form>
{% endblock %}
