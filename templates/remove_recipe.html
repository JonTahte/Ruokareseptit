{% extends "layout.html" %}

{% block title %}Reseptin poisto{% endblock %}

{% block content %}
<h2>{{ recipe.title }}</h2>
<h3>Reseptin poisto</h3>
<p>Haluatko varmasti poistaa reseptin?</p>
<form action="/remove_recipe/{{ recipe.id }}" method="post">
  <button type="submit" name="remove">Poista ilmoitus</button>
  <button type="submit" name="back">Peruuta</button>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
</form>
{% endblock %}
