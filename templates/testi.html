<!DOCTYPE html>
<html>

<head>
  <title>Testi</title>
</head>

<body>
    <form method="POST">
    {% for value in inputs %}
        <div>
            <input type="text" name="textbox" value="{{ value }}"/>
            <button type="submit" name="remove" value="{{ loop.index0 }}"> - </button>
        </div>
    {% endfor %}
    
    <br>
    <button type="submit" name="add">+</button>
    <button type="submit" name="send">Lähetä</button>
</form>
</body>

</html>
