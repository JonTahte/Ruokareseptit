<!DOCTYPE html>
<html>

<head>
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/main.css">
  <link rel="stylesheet" href="/static/create_edit.css">
</head>

<body>
  <h1>Reseptisovellus</h1>
  {% if session.user_id %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}
  </p>
  {% endif %}
  <p>
    <a href="/">Etusivu</a> |
    <a href="/search_recipe">Etsi resepti</a> |
    {% if session.user_id %}
      <a href="/new_recipe"> Uusi resepti</a> |
      <a href="/user/{{ session.user_id }}"> Omat Reseptit</a> |
      <a href="/logout"> Kirjaudu ulos</a>
    {% else %}
      <a href="/login"> Kirjaudu sisään</a> |
      <a href="/register"> luo tunnus</a>
    {% endif %}
  </p>
  <hr />
  {% block content %}{% endblock %}
</body>

</html>
