{% extends "layout.html" %}

{% block title %}Etsi resepti{% endblock %}

{% block content %}
<h2>Etsi resepti</h2>
<form action="/search_recipe" method="get">
  <p>
    Hakusana: <input type="text" name="query" value="{{ query }}">
  </p>
  <button type="submit">Lähetä</button>
</form>

{% if query %}
  <h3>Tulokset</h3>

  <ul>
    {% for recipe in results %}
      <li><a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a></li>
    {% endfor %}
  </ul>
{% endif %}
{% endblock %}
