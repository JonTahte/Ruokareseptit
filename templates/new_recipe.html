{% extends "layout.html" %}

{% block title %}Uusi resepti{% endblock %}

{% block content %}
<h2>Uusi resepti</h2>

<form method="post">
  <button type="submit" formaction="/create_recipe" name="send">Julkaise resepti</button>
  <p>
    Otsikko: <br />
    <input type="text" name="title" value="{{ session.get('title', '') }}" maxlength="50" required />
  </p>
  <p>
    Valmistusaika: </br>
    <input type="text" name="prep_time" value="{{ session.get('prep_time', '') }}" size="8" maxlength=3 pattern="^[1-9][0-9]{0,2}$" required /> min
  </p>
  Reseptin ainekset: <br />
  {% for ingredient in ingredients %}
      <div>
          <input type="text" name="ingredients" value="{{ ingredient }}" maxlength="50" required />
          <button type="submit" name="remove" value="{{ loop.index0 }}" formnovalidate> - </button>
      </div>
  {% endfor %}
  <button type="submit" name="add" formnovalidate> Uusi aines </button>
  <p>
  Valmistusohje:<br />
  <textarea name="cooking_steps" rows="8" cols="60" maxlength="1000" required>{{ session.get('cooking_steps', '') }}</textarea>
  </p>
  {% for class in classes %}
  <p>
    {{ class }}: <br />
    <select name="{{class}}">
      <option value="">(valitse)</option>
    {% for option in classes[class] %}
      <option value="{{option}}" {% if session.get(class) == option %}selected{% endif %}>{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}
</form>
{% endblock %}
