<!DOCTYPE html>
<html>

<head>
  <title>Arvostelut</title>
</head>

<body>
  <h1>{{ recipe.title }}</h1>
  {% if not reviews %}
    <h2> Reseptillä ei ole arvosteluja </h2>
  {% else %}
  <h2> Arvostelut </h2>
  <ul>
    {% for review in reviews %}
      <li><a href="/user/{{ review.user_id }}">{{ review.username }}</a><br>
        {% if review.comment %}
          {{ review.comment }}<br>
        {% endif %}
        Arvosana: {{ review.grade }}/5
      </li><br>
    {% endfor %}
  </ul>
  {% endif %}
  <p> 
    <a href="/recipe/{{ recipe.id }}">Takaisin</a>
  </p>
</body>

</html>
