<!DOCTYPE html>
<html>

<head>
  <title>{{ recipe.title }}</title>
</head>

<body>
    <h1>{{ recipe.title }}</h1>
    <p>
      Ainekset: 
      <ul>
        {% for ingredient in recipe.ingredients.split(", ") %}
          <li>{{ ingredient }}</li>
        {% endfor %}
      </ul>
    </p>
    <p>
        Valmistus: <br>
        {{ recipe.cooking_steps }}
    </p>
    <p>
      Kirjoittaja: {{ recipe.username}}
    </p>
    <p>
      <a href="/">Takaisin</a>
    </p>
</body>

</html>
